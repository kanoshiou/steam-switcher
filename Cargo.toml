[package]
name = "steam-switcher"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Tray-based Steam account switcher with one-click game launch"
license = "MIT"

[features]
# Default build: tray icon + gpui settings window. `--no-default-features`
# produces the tray-only executable (no gpui; the switcher lives entirely in
# the tray menu).
default = ["gui"]
gui = ["dep:gpui-kit"]

[dependencies]
# --- P1: tray and OS integration ---
tray-icon = "0.26"
sysinfo = "0.39"
notify-rust = "4"
# GUI-only (the `gui` feature): gpui-kit 0.7 settings window.
gpui-kit = { version = "0.7", optional = true }
rust-i18n = "4"
sys-locale = "0.3"

# --- Steam interaction (cross-platform) ---
keyvalues-parser = "0.2"

# --- General ---
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
crossbeam-channel = "0.5"
chrono = "0.4"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }
# Windows-only: compiling this on Linux emits a compile_error!
winreg = "0.56"

# Embeds assets/icon.ico into the exe (runs rc.exe from the Windows SDK)
# and generates the app-specific icon bundle (see build.rs).
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
serde_json = "1"

# Used by examples/gen-icon.rs to write assets/icon.ico (dev-only, not in the app).
[dev-dependencies]
png = "0.18"

[profile.release]
# Size-oriented: optimize for size, whole-program LTO with a single codegen
# unit, and abort on panic (no unwinding tables). A tray app does no hot
# number crunching; UI smoothness comes from the GPU drivers.
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
