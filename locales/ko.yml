  다음 Steam 게임이 실행 중입니다:

  %{games}

  지금 Steam을 종료하면 저장되지 않은 진행 상황을 잃을 수 있습니다(클라우드 세이브는 종료 시 업로드).

  그래도 종료하고 전환할까요?
